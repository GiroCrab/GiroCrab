name: Nightly

# Development build of `main` (issue #50). Ad-hoc signed only: Developer ID
# signing and notarization stay on the maintainer's Mac (scripts/notarize.sh
# --nightly), deliberately without Apple certificates in GitHub Secrets.
# The zip is kept as a workflow artifact, never attached to a release.

on:
  workflow_dispatch:
    inputs:
      sync_docs_and_website:
        description: "Sync README (PR) and girocrab.de with the latest stable release"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build app bundle (ad-hoc signed)
        run: ./package-macos-app.sh
      - name: Launch smoke test
        run: |
          dist/GiroCrab.app/Contents/MacOS/GiroCrabMac >/dev/null 2>&1 &
          PID=$!
          sleep 5
          kill -0 "$PID" || { echo "app exited within 5s" >&2; exit 1; }
          kill "$PID"
      - uses: actions/upload-artifact@v4
        with:
          name: GiroCrab-macOS-arm64-nightly
          path: dist/GiroCrab-macOS-arm64.zip
          retention-days: 14

  sync-docs-website:
    # Idempotent: no diff => nothing happens. Manual runs can opt out via the input.
    if: github.event_name == 'schedule' || inputs.sync_docs_and_website
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN || github.token }}
      WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git push auth
        run: git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Sync README and girocrab.de (latest stable release)
        run: scripts/sync-docs-and-website.sh --push
